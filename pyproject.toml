[project]
name = "keepout"
version = "0.1.0.dev0"
description = "Spacecraft conjunction assessment: screening, CDM ingest and generation, probability of collision, risk trends, a synthetic operator, a command line and avoidance manoeuvre planning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patryk Niczke" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = [
    "astropy>=8.0.2",
    "numpy>=2.4.6",
    "platformdirs>=4.13.5",
    "pyerfa>=2.0.1.5",
    "scipy>=1.17.1",
    "sgp4>=2.27",
]

[project.scripts]
keepout = "keepout.cli:main"

[project.optional-dependencies]
cli = [
    "rich>=15.0.0",
    "typer>=0.27.2",
]
validation = [
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]
store = [
    "alembic>=1.20.1",
    "sqlalchemy>=2.1.8",
]
dashboard = [
    "keepout[store]",
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "NPY",
    "ARG", "BLE", "C4", "D", "DTZ", "FBT", "FURB", "PERF", "PGH", "PIE", "PTH",
    "RET", "TID", "A", "ERA", "RSE", "SLOT", "ISC",
    "S", "C90", "PL", "PYI", "SLF", "ANN401", "TC",
    # Preview: every exception a function raises is in its docstring, and
    # strings joined inside a list or call are parenthesized (no lost comma).
    "DOC501", "ISC004",
]
# Only the preview rules selected by code above, not all of them.
preview = true
explicit-preview-rules = true
ignore = [
    # Exception names follow the spec (SourceUnavailable, ChecksumMismatch, ...).
    "N818",
    # House docstring style: a noun-phrase summary, which may wrap onto a
    # second line, with the closing quotes right after the last sentence.
    "D205", "D209", "D401",
    # Dunder methods and __init__ are documented on the class.
    "D105", "D107",
    # Physics and spec numbers are named where they mean something; options
    # are keyword-only, so long signatures stay readable.
    "PLR2004", "PLR0913", "PLR0917",
    # Imports inside a function keep heavy modules off `import keepout`.
    "PLC0415",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-type-checking]
# The ORM reads the Mapped[...] annotations of the models at runtime, and
# typeguard those of the TypedDicts the tools read back (generated.read_json).
runtime-evaluated-base-classes = ["keepout.store.models.Base", "typing.TypedDict"]

[tool.ruff.lint.per-file-ignores]
# Tests: named test functions need no docstrings; fixtures and fakes take
# arguments they do not use, and parametrized tests take booleans.
# They assert, pickle round-trips, parse the XML they wrote, reach into the
# fault-injection seams and fake callables with Any.
"tests/**" = ["D", "DOC", "ARG", "FBT", "S101", "S301", "S314", "SLF001", "ANN401"]
# Inline snapshots hold the commands' output line for line.
"tests/cli/test_cli_{assess,screen,maneuver}.py" = ["E501"]
# A command's docstring is its --help text, which states its exit statuses.
"src/keepout/cli/{assess,dashboard,maneuver,screen}.py" = ["DOC501"]
# Typer reads the commands' annotations (Annotated options) at runtime.
"src/keepout/cli/**" = ["TC"]
# The tools run git and Python with arguments they build themselves.
"tools/**" = ["S603", "S607"]
# Stubs mirror the names sgp4 and astropy give (jdsatepochF, IERS_Auto,
# format=), and type what astropy leaves dynamic (array-or-scalar values) as Any.
"stubs/**" = ["N801", "N815", "ANN401", "A002"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]
mypy_path = ["tools", "stubs"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "redundant-self",
    "mutable-override",
]

[[tool.mypy.overrides]]
module = ["xlrd.*"]
ignore_missing_imports = true

[tool.codespell]
# Data, generated and locked files; test data holds verbatim external records.
skip = "*.csv,*.gz,*.xsd,*.json,uv.lock,./site,*tests/*/data*"
# AAS: American Astronautical Society; oint: LaTeX \oint; precesses: precession.
ignore-words-list = "aas,oint,precesses"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
# --disable-socket: no test reaches the network; conftest.py lets the
# validation tests, which download their data, and the e2e tests, which
# drive a browser, open sockets. The slow tests
# run in CI (-m "not validation"), not by default.
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not validation and not slow and not e2e",
    "--disable-socket",
    "--allow-unix-socket",
]
filterwarnings = ["error"]
markers = [
    "slow: tests of tens of seconds (full burn grids, week-long integrations, the screening and synthetic operator reports on the committed GP data); CI runs them",
    "e2e: the Playwright scenario against a running docker compose up (KEEPOUT_E2E_URL); CI's e2e job runs it",
    "validation: slow checks against reference data (NASA CARA and ESA Kelvins data download on first run; the Space-Track answers check needs KEEPOUT_SPACETRACK_RAW)",
]

[tool.coverage.run]
# Directories, not the package's name: AppTest runs the dashboard's pages as
# scripts (__main__), which a package source would not measure.
source = ["src/keepout", "tools"]
branch = true

[tool.coverage.report]
# The dashboard is measured (AppTest runs it in-process) but left out of the
# threshold, which is the core's; CI holds it to its own (85 %).
omit = ["*/keepout/dashboard/*"]
fail_under = 90
exclude_also = ["assert_never\\("]
show_missing = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "codespell>=2.4.3",
    "deptry>=0.25.1",
    "hypothesis>=6.170.9",
    "imageio-ffmpeg>=0.8.1",
    "import-linter>=2.15",
    "inline-snapshot>=0.36.1",
    "keepout[cli,validation,store,dashboard]",
    "matplotlib>=3.11.2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
    "mypy>=2.4.0",
    "playwright>=1.65.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-alembic>=0.13.2",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "scipy-stubs>=1.17.1.5",
    "typeguard>=4.6.0",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20261113",
    "typing-extensions>=4.16.0",
    "xmlschema>=4.3.2",
    "zizmor>=1.31.1",
]

[tool.basedpyright]
# A second type checker beside mypy (strict above): it finds other mistakes.
include = ["src", "tests", "tools"]
extraPaths = ["tests", "tools"]
stubPath = "stubs"
typeCheckingMode = "standard"
# Two rules from the stricter levels: overriding methods say so, and no
# deprecated typing forms. (Unused ignores are mypy's warn_unused_ignores.)
reportImplicitOverride = "error"
reportDeprecated = "error"
# The store and the settings hold untyped data (JSON, SQL rows, the
# environment): there, every value has a known type. So in the dashboard
# (st.session_state holds Any), but for the members of Streamlit, whose own
# signatures are partly unknown.
executionEnvironments = [
    { root = "src/keepout/dashboard", extraPaths = ["src"], reportUnknownVariableType = "error", reportUnknownArgumentType = "error", reportAny = "error" },
    { root = "src/keepout/store", extraPaths = ["src"], reportUnknownVariableType = "error", reportUnknownArgumentType = "error", reportUnknownMemberType = "error", reportAny = "error", reportUnnecessaryIsInstance = "error", reportUnnecessaryComparison = "error" },
    { root = "src/keepout/settings.py", extraPaths = ["src"], reportUnknownVariableType = "error", reportUnknownArgumentType = "error", reportUnknownMemberType = "error", reportAny = "error", reportUnnecessaryIsInstance = "error", reportUnnecessaryComparison = "error" },
    { root = ".", extraPaths = ["tests", "tools"] },
]

[tool.deptry]
# The tools and tests are not shipped: only the package's imports are checked.
known_first_party = ["keepout"]

[tool.deptry.package_module_name_map]
pyerfa = "erfa"

[tool.deptry.per_rule_ignores]
# The dashboard extra names keepout[store] (the store it reads): keepout
# itself, not a package to import.
DEP002 = ["keepout"]

[tool.importlinter]
root_package = "keepout"
exclude_type_checking_imports = true
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: data sources and formats above the geometry they build"
type = "layers"
layers = [
    "keepout.cli | keepout.dashboard",
    "keepout.store",
    "keepout.validation | keepout.settings | keepout.figures",
    "keepout.maneuver",
    "keepout.sources | keepout.synthetic",
    "keepout.events",
    "keepout.risk | keepout.screening",
    "keepout.pc | keepout.cdm | keepout.propagation",
    "keepout.omm | keepout.conjunction",
    "keepout.ccsds | keepout.encounter",
    "keepout.objects | keepout.equinoctial",
    "keepout.covariance | keepout.orbits",
    "keepout.frames",
    "keepout.state",
    "keepout._workers",
    "keepout._linalg",
    "keepout._types | keepout._validation | keepout._methods | keepout._defaults | keepout._text | keepout._environment | keepout.errors",
    "keepout.units",
]

[[tool.importlinter.contracts]]
name = "The store does not draw: no figures in the store"
type = "forbidden"
source_modules = ["keepout.store"]
forbidden_modules = ["keepout.figures"]

[[tool.importlinter.contracts]]
name = "Only the command line uses the cli extra"
type = "forbidden"
source_modules = ["keepout"]
forbidden_modules = ["typer", "rich"]
ignore_imports = ["keepout.cli.** -> typer", "keepout.cli.** -> rich"]

[[tool.importlinter.contracts]]
name = "Only the store uses the store extra"
type = "forbidden"
source_modules = ["keepout"]
forbidden_modules = ["sqlalchemy", "alembic"]
ignore_imports = ["keepout.store.** -> sqlalchemy", "keepout.store.** -> alembic"]

[[tool.importlinter.contracts]]
name = "Only the dashboard uses the dashboard extra"
type = "forbidden"
source_modules = ["keepout"]
forbidden_modules = ["streamlit", "plotly"]
ignore_imports = ["keepout.dashboard.** -> streamlit", "keepout.dashboard.** -> plotly"]

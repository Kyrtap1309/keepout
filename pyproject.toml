[project]
name = "keepout"
version = "0.1.0.dev0"
description = "Spacecraft conjunction assessment: CDM ingest, probability of collision, risk trends and avoidance manoeuvre planning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patryk Niczke" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = [
    "astropy>=8.0.1",
    "numpy>=2.4.6",
    "platformdirs>=4.11.12",
    "pyerfa>=2.0.1.5",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
validation = [
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "NPY",
    "ARG", "BLE", "C4", "D", "DTZ", "FBT", "FURB", "PERF", "PGH", "PIE", "PTH",
    "RET", "TID",
]
ignore = [
    # Exception names follow the spec (SourceUnavailable, ChecksumMismatch, ...).
    "N818",
    # House docstring style: a noun-phrase summary, which may wrap onto a
    # second line, with the closing quotes right after the last sentence.
    "D205", "D209", "D401",
    # Dunder methods and __init__ are documented on the class.
    "D105", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests: named test functions need no docstrings; fixtures and fakes take
# arguments they do not use, and parametrized tests take booleans.
"tests/**" = ["D", "ARG", "FBT"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]
mypy_path = ["tools"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "redundant-self",
    "mutable-override",
]

[[tool.mypy.overrides]]
module = ["astropy.*", "erfa.*", "xlrd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = ["-ra", "--strict-markers", "-m", "not validation"]
filterwarnings = ["error"]
markers = [
    "validation: needs NASA CARA or ESA Kelvins data (downloads on first run)",
]

[tool.coverage.run]
source = ["keepout"]
omit = ["*/keepout/cli/*", "*/keepout/dashboard/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "keepout[validation]",
    "matplotlib>=3.11.2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.16.8",
    "scipy-stubs>=1.17.1.5",
    "types-openpyxl>=3.1.5.20260827",
    "xmlschema>=4.3.2",
]

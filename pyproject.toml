[project]
name = "keepout"
version = "0.1.0.dev0"
description = "Spacecraft conjunction assessment: CDM ingest, probability of collision, risk trends and avoidance manoeuvre planning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patryk Niczke" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = [
    "astropy>=8.0.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "NPY"]
# Exception names follow the spec (SourceUnavailable, ChecksumMismatch, ...).
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*", "astropy.*", "erfa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not validation"]
markers = [
    "validation: needs NASA CARA reference data (downloads on first run)",
]

[tool.coverage.run]
source = ["keepout"]
omit = ["*/keepout/cli/*", "*/keepout/dashboard/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

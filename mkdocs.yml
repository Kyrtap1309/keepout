site_name: keepout
site_description: Spacecraft conjunction assessment in Python
copyright: Copyright &copy; 2026 Patryk Niczke — MIT licence
repo_url: https://github.com/Kyrtap1309/keepout
repo_name: Kyrtap1309/keepout
edit_uri: ""

# Local working notes (git-ignored), never part of the site.
exclude_docs: |
  superpowers/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - tools/griffe_sphinx_roles.py
            docstring_style: numpy
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Getting started: index.md
  - Concepts and glossary: concepts.md
  - Guides:
      - Screening: screening.md
      - Synthetic operator: synthetic.md
      - 2-D probability of collision: pc-2d.md
      - 3-D, Monte Carlo and maximum Pc: pc-3d.md
      - Risk assessment: risk.md
      - Manoeuvre planning: maneuver.md
      - Command line: cli.md
      - JSON output: cli-json.md
      - Conjunction store: store.md
      - Space-Track data: spacetrack.md
      - FAQ and troubleshooting: faq.md
  - Background:
      - Synthetic covariance model: assumptions.md
      - Frames and units: frames-and-units.md
  - Reports:
      - Validation report: validation.md
      - Monte Carlo validation report: validation-monte-carlo.md
      - Risk on ESA's Kelvins data: risk-kelvins.md
      - Screening against SOCRATES: screening-socrates.md
      - Synthetic operator on public data: synthetic-operator.md
      - Manoeuvre planning on a CARA event: maneuver-report.md
  - Reference:
      - Overview: reference/index.md
      - Core types:
          - Conjunction: reference/conjunction.md
          - Objects and state vectors: reference/objects.md
          - Covariance: reference/covariance.md
          - Encounter plane: reference/encounter.md
          - Frames: reference/frames.md
          - Units: reference/units.md
          - Propagation: reference/propagation.md
          - Equinoctial elements: reference/equinoctial.md
      - Pc and risk:
          - Probability of collision: reference/pc.md
          - Conjunction events: reference/events.md
          - Risk: reference/risk.md
          - Manoeuvres: reference/maneuver.md
          - Operator settings: reference/settings.md
      - Screening and operator:
          - Screening: reference/screening.md
          - Synthetic operator: reference/synthetic.md
      - Formats:
          - CDM: reference/cdm.md
          - Element sets (OMM): reference/omm.md
          - CCSDS formats: reference/ccsds.md
      - Data sources:
          - GP catalog: reference/catalog.md
          - CelesTrak data: reference/celestrak.md
          - Space-Track data: reference/spacetrack.md
          - CARA reference data: reference/cara.md
          - Kelvins data: reference/kelvins.md
          - Data cache: reference/cache.md
          - Conjunction store: reference/store.md
      - Validation and errors:
          - Validation tooling: reference/validation.md
          - Errors: reference/errors.md
  - Changelog: changelog.md

validation:
  links:
    anchors: warn

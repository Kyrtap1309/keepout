site_name: keepout
site_description: Spacecraft conjunction assessment in Python
copyright: Copyright &copy; 2026 Patryk Niczke — MIT licence

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Frames, units and CDM support: frames-and-units.md
  - Reference:
      - CDM: reference/cdm.md
      - Covariance: reference/covariance.md
      - Encounter plane: reference/encounter.md
      - Frames: reference/frames.md
      - Objects and state vectors: reference/objects.md
      - CARA reference data: reference/cara.md
      - Errors: reference/errors.md

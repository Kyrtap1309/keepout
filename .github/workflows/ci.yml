name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing
        env:
          HYPOTHESIS_PROFILE: ci

  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/keepout/cara
          key: cara-${{ hashFiles('src/keepout/sources/cara_manifest.sha256') }}
      - run: uv sync --locked
      - id: kelvins
        # Keyed by the pinned table, so editing the loader keeps the 221 MB cache.
        run: >-
          echo "key=kelvins-$(uv run python -c 'from keepout.sources import kelvins;
          print(kelvins.ZENODO_RECORD, kelvins.RAW_SHA256, sep="-")')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/keepout/kelvins
          key: ${{ steps.kelvins.outputs.key }}
      - run: uv run pytest -m validation -v
      - run: uv run python tools/risk_report.py --check
      - run: uv run python tools/validation_report.py
      - run: git add --intent-to-add docs && git diff --exit-code -- docs README.md
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            docs/validation.json
            docs/validation.md
            README.md

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run mkdocs build --strict

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run basedpyright
      - run: uv run lint-imports
      - run: uv run codespell
      - run: uv run deptry src
      - run: uv run zizmor --offline .github

  types-oldest:
    # The type checkers on the oldest supported Python, against the NumPy and
    # SciPy versions it installs (their stubs differ from the newest ones).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run mypy
      - run: uv run basedpyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # -m replaces the default marker filter: the slow tests run here too.
      - run: uv run pytest -n auto -m "not validation" --cov --cov-report=term-missing
        env:
          HYPOTHESIS_PROFILE: ci
      # The dashboard's own floor, from the same data. --omit replaces the
      # configured one (which leaves the dashboard out); the views package
      # is never imported: Streamlit runs its pages as scripts.
      - run: >-
          uv run coverage report --include='*/keepout/dashboard/*'
          --omit='*/keepout/dashboard/views/__init__.py' --fail-under=85

  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/keepout/cara
          key: cara-${{ hashFiles('src/keepout/sources/cara_manifest.sha256') }}
      - run: uv sync --locked
      - id: kelvins
        # Keyed by the pinned table, so editing the loader keeps the 221 MB cache.
        run: >-
          echo "key=kelvins-$(uv run python -c 'from keepout.sources import kelvins;
          print(kelvins.ZENODO_RECORD, kelvins.RAW_SHA256, sep="-")')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/keepout/kelvins
          key: ${{ steps.kelvins.outputs.key }}
      - run: uv run pytest -n auto -m validation -v
      - run: uv run python tools/risk_report.py --check
      - run: uv run python tools/screening_report.py --check
      - run: uv run python tools/screening_benchmark.py --check
      - run: uv run python tools/screening_benchmark.py --source spacetrack --check
      - run: uv run python tools/synthetic_operator_report.py --check
      - run: uv run python tools/dashboard_seed.py --check
      - run: uv run python tools/maneuver_report.py --check
      - run: uv run python tools/validation_report.py
      - run: git add --intent-to-add docs && git diff --exit-code -- docs README.md
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-results
          path: |
            docs/validation.json
            docs/validation.md
            README.md

  benchmark:
    # Screening and dashboard speed of this tree against the merge base, on the
    # same runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - id: base
        name: Check out the merge base
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if commit=$(git merge-base "$BASE" HEAD); then
            git worktree add --detach "$RUNNER_TEMP/base" "$commit"
            echo "python=$RUNNER_TEMP/base/.venv/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No merge base with $BASE, nothing to compare with."
          fi
      - if: steps.base.outputs.python
        working-directory: ${{ runner.temp }}/base
        run: uv sync --locked || echo "::notice::The merge base cannot be set up."
      - if: steps.base.outputs.python
        env:
          BASE_PYTHON: ${{ steps.base.outputs.python }}
        run: >-
          uv run python tools/screening_benchmark.py compare
          --base-python "$BASE_PYTHON"
      # Skipped (exit 0) when the merge base has no dashboard.
      - if: steps.base.outputs.python
        env:
          BASE_PYTHON: ${{ steps.base.outputs.python }}
        run: >-
          uv run python tools/dashboard_benchmark.py compare
          --base-python "$BASE_PYTHON"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run mkdocs build --strict
      # The site is not published; download it from the run's artifacts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site

  e2e:
    # docker compose up as a user runs it: the image built from the lock, the
    # demo's store, the dashboard healthy and answering, the data kept across
    # a restart.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose build
      - run: docker compose up --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8501/_stcore/health
          curl -fsS -o /dev/null http://127.0.0.1:8501/
      - name: Restart keeps the store
        run: |
          docker compose down
          docker compose up --wait --wait-timeout 180
          docker compose logs init | grep -q "store kept: /data/keepout.db"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

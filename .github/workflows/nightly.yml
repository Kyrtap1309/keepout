name: Nightly Monte Carlo validation

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-mc
  cancel-in-progress: false

jobs:
  monte-carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/keepout
          key: cara-${{ hashFiles('src/keepout/sources/cara_manifest.sha256') }}
      - run: uv sync --locked
      - run: uv run python tools/validation_report.py --monte-carlo
      - run: git add --intent-to-add docs && git diff --exit-code -- docs README.md
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-monte-carlo-results
          path: |
            docs/validation-monte-carlo.json
            docs/validation-monte-carlo.md
            README.md

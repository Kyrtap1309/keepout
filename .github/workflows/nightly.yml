name: Nightly Monte Carlo validation, Kelvins risk report and dependency audit

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-mc
  cancel-in-progress: false

jobs:
  monte-carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/keepout/cara
          key: cara-${{ hashFiles('src/keepout/sources/cara_manifest.sha256') }}
      - run: uv sync --locked
      - run: uv run python tools/validation_report.py --monte-carlo
      - run: git add --intent-to-add docs && git diff --exit-code -- docs README.md
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-monte-carlo-results
          path: |
            docs/validation-monte-carlo.json
            docs/validation-monte-carlo.md
            README.md

  risk-kelvins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - id: kelvins
        # Keyed by the pinned table, so editing the loader keeps the 221 MB cache.
        run: >-
          echo "key=kelvins-$(uv run python -c 'from keepout.sources import kelvins;
          print(kelvins.ZENODO_RECORD, kelvins.RAW_SHA256, sep="-")')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/keepout/kelvins
          key: ${{ steps.kelvins.outputs.key }}
      - run: uv run python tools/risk_report.py --check

  iridium-cosmos:
    # The case study recomputes a week of screening, a burn grid and a day of
    # the fragments against the full catalog: minutes, so nightly only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run python tools/iridium_cosmos_data.py verify
      - run: uv run python tools/iridium_cosmos_report.py --check

  audit:
    # Known vulnerabilities in every locked package, extras and dev tools included.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: >-
          uv export --locked --all-extras --all-groups --no-emit-project
          --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit@2.10.1 --strict -r "$RUNNER_TEMP/requirements.txt"

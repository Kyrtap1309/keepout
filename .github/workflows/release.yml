name: Release

# A tag vX.Y.Z on a commit of main: the sdist and wheel, and a GitHub
# Release with the changelog's section for X.Y.Z as its notes
# (CONTRIBUTING.md, Releasing). keepout is not published to PyPI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Nothing is installed: the version is pyproject's, and the notes tool
      # needs only the standard library.
      - name: The tag names the project's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match the project's version $version" >&2
            exit 1
          fi
      - run: uv build
      - name: Notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project python tools/changelog_section.py "${TAG#v}" > "$RUNNER_TEMP/notes.md"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --verify-tag --title "keepout ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
